# 512MB 内存 + zram 的调参
vm.swappiness=100              # 有 zram，积极换出匿名页
vm.vfs_cache_pressure=200      # 优先回收 inode/dentry 缓存
vm.dirty_ratio=15
vm.dirty_background_ratio=5
vm.min_free_kbytes=8192        # 别设太大，512MB 机器会被吃掉可用内存
vm.overcommit_memory=0
vm.zone_reclaim_mode=0
kernel.panic=10
kernel.panic_on_oops=0
net.core.rmem_max=262144
net.core.wmem_max=262144
