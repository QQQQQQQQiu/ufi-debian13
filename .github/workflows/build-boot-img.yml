name: build-bootimg
on:
  workflow_dispatch:
    inputs:
      dtb_name:
        required: true
        default: 'msm8916-yiming-uz801v3'
        type: choice
        options:
          - msm8916-thwc-ufi001c
          - msm8916-thwc-uf896
          - msm8916-yiming-uz801v3
          - msm8916-fy-mf800
      kernel_ref:
        description: '内核分支/tag。留空=用仓库默认分支(wip/msm8916/7.3-rc2、wip/msm8916/7.0)'
        required: false
        default: ''
      boot_cmdline:
        description: 'boot.img cmdline (写入 boot header，上限 512 字节)'
        required: true
        default: 'earlycon root=PARTUUID=a7ab80e8-e9d1-e8cd-f157-93f69b1d141e console=ttyMSM0,115200 no_framebuffer=true rw androidboot.emmc=true androidboot.serialno=11c722 androidboot.baseband=msm mdss_mdp.panel=0:dsi:0:'

env:
  DEBIAN_FRONTEND: noninteractive
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04
 #   runs-on: ubuntu-latest
 #   container: debian:trixie
    timeout-minutes: 350

    steps:
      - name: 检出本套件
        uses: actions/checkout@v4

      - name: 安装交叉编译依赖
        run: |
          sudo apt-get -o Acquire::Retries=5 \
                       -o Acquire::http::Timeout=60 \
                       -o Acquire::https::Timeout=60 update
          sudo apt-get -o Acquire::Retries=5 \
                       -o Acquire::http::Timeout=60 \
                       -o Acquire::https::Timeout=60 \
                       install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libdw-dev libncurses-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            kmod cpio rsync xz-utils zstd device-tree-compiler \
            dwarves libelf-dev python3 git curl ca-certificates ccache
          sudo apt-get install -y mkbootimg
          
           # 修复 mkbootimg 缺失 gki 模块的问题
          # 不同发行版/版本路径可能略有差异，这里同时尝试两个常见位置
          GKI_PATH=""
          for p in /usr/share/android-tools/mkbootimg /usr/lib/android-tools; do
            if [ -d "$p/gki" ]; then
              GKI_PATH="$p"
              break
            fi
          done
          
          if [ -n "$GKI_PATH" ]; then
            echo "找到 gki 模块路径: $GKI_PATH"
            export PYTHONPATH="$GKI_PATH:$PYTHONPATH"
          else
            echo "未在预期路径找到 gki 模块，尝试直接运行 mkbootimg（如果仍失败，请考虑方案 B）"
          fi
          
      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-boot-msm8916-${{ inputs.kernel_ref || 'default' }}-${{ hashFiles('kernel-fragments/**') }}
          restore-keys: |
            ccache-boot-msm8916-${{ inputs.kernel_ref || 'default' }}-

      - name: 拉取内核源码
        run: |
          mkdir -p src && cd src
          if [ -n "${{ inputs.kernel_ref }}" ]; then
            git clone --depth 1 -b "${{ inputs.kernel_ref }}" \
              https://github.com/msm8916-mainline/linux.git linux
          else
            git clone --depth 1 https://github.com/msm8916-mainline/linux.git linux
          fi
          echo "=== 实际检出的分支/版本 ==="
          git -C linux branch --show-current
          echo "内核版本: $(git -C linux describe --tags 2>/dev/null || git -C linux rev-parse --short HEAD)"
          echo "=== 内核树里的 UFI/同类 DTB ==="
          ls linux/arch/arm64/boot/dts/qcom/ | grep -E "msm8916.*(thwc|uz801|ufi|mf800|jz)" || true

      - name: 内核config
        run: |
          cd src/linux
          export PATH="/usr/lib/ccache:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          ccache -M 5G

          echo "----- 应用内核配置片段 kcfg是完整的内核配置 -----"
          ls -la ../../kernel-fragments/
          cp ../../kernel-fragments/kcfg .config
          make olddefconfig
          
      - name: 编译内核与 DTB
        run: |
          cd src/linux
          export PATH="/usr/lib/ccache:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) Image.gz dtbs
          ls -lh arch/arm64/boot/Image.gz
          ls -lh arch/arm64/boot/dts/qcom/${{ inputs.dtb_name }}.dtb

      - name: 拼接 Image.gz-dtb
        run: |
          cd src/linux
          cat arch/arm64/boot/Image.gz \
              arch/arm64/boot/dts/qcom/${{ inputs.dtb_name }}.dtb \
              > arch/arm64/boot/Image.gz-dtb
          ls -lh arch/arm64/boot/Image.gz-dtb

      - name: 编译内核模块并安装
        run: |
          cd src/linux
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # 关键：先编译所有模块，这会生成 modules.order
          make -j$(nproc) modules

          # 然后再安装模块
          make INSTALL_MOD_PATH="${{ github.workspace }}/modules_out" modules_install

          KERNEL_VERSION=$(make -s kernelrelease)
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> "$GITHUB_ENV"
          echo "模块已安装到 ${{ github.workspace }}/modules_out/lib/modules/$KERNEL_VERSION"
          du -sh "${{ github.workspace }}/modules_out"

      - name: 构建 Debian initramfs
        run: |
          sudo apt-get install -y initramfs-tools

          sudo mkdir -p "/lib/modules/$KERNEL_VERSION"
          sudo cp -a "${{ github.workspace }}/modules_out/lib/modules/$KERNEL_VERSION/." "/lib/modules/$KERNEL_VERSION/"
          sudo depmod -a "$KERNEL_VERSION"

          for m in sdhci_msm mmc_block ext4; do
            echo "$m" | sudo tee -a /etc/initramfs-tools/modules
          done

          echo 'MODULES=dep' | sudo tee /etc/initramfs-tools/initramfs.conf

          # 关键修改：用 -c gzip 显式指定压缩格式，避免 COMPRESS 未设置错误
          sudo mkinitramfs -c gzip -k "$KERNEL_VERSION" -o "${{ github.workspace }}/initrd.img"
          ls -lh "${{ github.workspace }}/initrd.img"

      - name: 打包 boot.img
        run: |
          # 尝试修复 mkbootimg 的 gki 模块问题
          GKI_FOUND=false
          for p in /usr/share/android-tools/mkbootimg /usr/lib/android-tools; do
            if [ -d "$p/gki" ]; then
              export PYTHONPATH="$p:$PYTHONPATH"
              GKI_FOUND=true
              break
            fi
          done

          if $GKI_FOUND && mkbootimg \
              --base 0x80000000 \
              --kernel_offset 0x00080000 \
              --ramdisk_offset 0x02000000 \
              --tags_offset 0x01e00000 \
              --pagesize 2048 \
              --second_offset 0x00f00000 \
              --ramdisk initrd.img \
              --cmdline "${{ inputs.boot_cmdline }}" \
              --kernel src/linux/arch/arm64/boot/Image.gz-dtb \
              -o boot.img; then
            echo "使用 mkbootimg 打包成功"
          else
            echo "mkbootimg 不可用，回退到 abootimg"
            sudo apt-get install -y abootimg
            abootimg --create boot.img \
              -k src/linux/arch/arm64/boot/Image.gz-dtb \
              -r initrd.img \
              -c "cmdline=${{ inputs.boot_cmdline }}" \
              -c "pagesize=0x800" \
              -c "kerneladdr=0x80080000" \
              -c "ramdiskaddr=0x82000000" \
              -c "secondaddr=0x80f00000" \
              -c "tagsaddr=0x81e00000"
          fi
          
      - name: 上传 boot.img 工件
        uses: actions/upload-artifact@v4
        with:
          name: boot-msm8916-${{ inputs.dtb_name }}
          path: boot.img
     
