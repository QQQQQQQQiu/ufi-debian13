name: build-bootimg
on:
  workflow_dispatch:
    inputs:
      dtb_name:
        required: true
        default: 'msm8916-yiming-uz801v3'
        type: choice
        options:
          - msm8916-thwc-ufi001c
          - msm8916-thwc-uf896
          - msm8916-yiming-uz801v3
          - msm8916-fy-mf800
      kernel_ref:
        description: '内核分支/tag。留空=用仓库默认分支(wip/msm8916/7.3-rc2、wip/msm8916/7.0)'
        required: false
        default: ''
      boot_cmdline:
        description: 'boot.img cmdline (写入 boot header，上限 512 字节)'
        required: true
        default: 'earlycon root=PARTUUID=a7ab80e8-e9d1-e8cd-f157-93f69b1d141e console=ttyMSM0,115200 no_framebuffer=true rw androidboot.emmc=true androidboot.serialno=11c722 androidboot.baseband=msm mdss_mdp.panel=0:dsi:0:'

env:
  DEBIAN_FRONTEND: noninteractive
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 检出本套件
        uses: actions/checkout@v4

      - name: 安装交叉编译依赖
        run: |
          sudo apt-get -o Acquire::Retries=5 \
                       -o Acquire::http::Timeout=60 \
                       -o Acquire::https::Timeout=60 update
          sudo apt-get -o Acquire::Retries=5 \
                       -o Acquire::http::Timeout=60 \
                       -o Acquire::https::Timeout=60 \
                       install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libdw-dev libncurses-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            kmod cpio rsync xz-utils zstd device-tree-compiler \
            dwarves libelf-dev python3 git curl ca-certificates ccache
          sudo apt-get install -y abootimg
          

      - name: 拉取内核源码
        run: |
          mkdir -p src && cd src
          if [ -n "${{ inputs.kernel_ref }}" ]; then
            git clone --depth 1 -b "${{ inputs.kernel_ref }}" \
              https://github.com/msm8916-mainline/linux.git linux
          else
            git clone --depth 1 https://github.com/msm8916-mainline/linux.git linux
          fi
          echo "=== 实际检出的分支/版本 ==="
          git -C linux branch --show-current
          echo "内核版本: $(git -C linux describe --tags 2>/dev/null || git -C linux rev-parse --short HEAD)"
          echo "=== 内核树里的 UFI/同类 DTB ==="
          ls linux/arch/arm64/boot/dts/qcom/ | grep -E "msm8916.*(thwc|uz801|ufi|mf800|jz)" || true

      - name: 应用 CPU 超频补丁
        run: |
          cp kernel-fragments/a53-pll.c src/linux/drivers/clk/qcom/a53-pll.c
          
          DTSI=src/linux/arch/arm64/boot/dts/qcom/msm8916.dtsi
          python3 tools/opp-overclock.py --check --dtsi "$DTSI" || echo "!! --check 未通过，跳过超频（不影响出包）"
            
          ARGS=(--apply --hz "1152000000" --dtsi "$DTSI")
          python3 tools/opp-overclock.py "${ARGS[@]}"
          
          ARGS=(--apply --hz "1363200000" --dtsi "$DTSI")
          python3 tools/opp-overclock.py "${ARGS[@]}"
          
          ARGS=(--apply --hz "1401600000" --dtsi "$DTSI")
          python3 tools/opp-overclock.py "${ARGS[@]}"
          
          ARGS=(--apply --hz "1612800000" --dtsi "$DTSI")
          python3 tools/opp-overclock.py "${ARGS[@]}"
          
          ARGS=(--apply --hz "1843200000" --dtsi "$DTSI")
          python3 tools/opp-overclock.py "${ARGS[@]}"

          ARGS=(--apply --hz "1996800000" --dtsi "$DTSI")
          python3 tools/opp-overclock.py "${ARGS[@]}"
          
          ARGS=(--apply --hz "2106800000" --dtsi "$DTSI")
          python3 tools/opp-overclock.py "${ARGS[@]}"
          
          echo "=== 补丁后 OPP 复核 ==="
          python3 tools/opp-overclock.py --check --dtsi "$DTSI" || true
          
      - name: 内核config
        run: |
          cd src/linux
          export PATH="/usr/lib/ccache:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          ccache -M 5G

          echo "----- 应用内核配置片段 kcfg是完整的内核配置 -----"
          ls -la ../../kernel-fragments/
          cp ../../kernel-fragments/kcfg .config
          
          #合并自定义配置片段
          chmod +x scripts/kconfig/merge_config.sh 2>/dev/null || true
          if [ -f ../../kernel-fragments/ufi-lowmem.config ]; then
            ./scripts/kconfig/merge_config.sh -m .config \
              ../../kernel-fragments/ufi-lowmem.config
            echo "!! 合并片段成功"  
          else
            echo "!! 找不到低内存配置片段，跳过合并"
          fi
          
          make olddefconfig
          
      - name: 覆盖修改过的dts-基带
        run: |
          cp kernel-fragments/msm8916-ufi.dtsi src/linux/arch/arm64/boot/dts/qcom/msm8916-ufi.dtsi
          
      - name: DTB
        run: |
          cd src/linux
          export PATH="/usr/lib/ccache:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) dtbs
          ls -lh arch/arm64/boot/dts/qcom/${{ inputs.dtb_name }}.dtb
          
      - name: 内核
        run: |
          cd src/linux
          export PATH="/usr/lib/ccache:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) Image.gz
          ls -lh arch/arm64/boot/Image.gz
          
      - name: 拼接 Image.gz-dtb
        run: |
          cd src/linux
          cat arch/arm64/boot/Image.gz \
              arch/arm64/boot/dts/qcom/${{ inputs.dtb_name }}.dtb \
              > arch/arm64/boot/Image.gz-dtb
          ls -lh arch/arm64/boot/Image.gz-dtb

      - name: 打包 boot.img
        run: |
            abootimg --create boot.img \
              -k src/linux/arch/arm64/boot/Image.gz-dtb \
              -r kernel-fragments/initrd.img \
              -c "cmdline=${{ inputs.boot_cmdline }}" \
              -c "pagesize=0x800" \
              -c "kerneladdr=0x80080000" \
              -c "ramdiskaddr=0x82000000" \
              -c "secondaddr=0x80f00000" \
              -c "tagsaddr=0x81e00000"
          
      - name: 上传 boot.img 工件
        uses: actions/upload-artifact@v4
        with:
          name: msm8916-${{ inputs.dtb_name }}
          path: |
            boot.img
            src/linux/arch/arm64/boot/Image.gz
          retention-days: 30
          