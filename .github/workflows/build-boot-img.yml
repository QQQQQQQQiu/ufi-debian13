name: build-bootimg
on:
  workflow_dispatch:
    inputs:
      dtb_name:
        required: true
        default: 'msm8916-yiming-uz801v3'
        type: choice
        options:
          - msm8916-thwc-ufi001c
          - msm8916-thwc-uf896
          - msm8916-yiming-uz801v3
          - msm8916-fy-mf800
      kernel_ref:
        description: '内核分支/tag。留空=用仓库默认分支(wip/msm8916/7.3-rc2、wip/msm8916/7.0)'
        required: false
        default: ''
      boot_cmdline:
        description: 'boot.img cmdline (写入 boot header，上限 512 字节)'
        required: true
        default: 'earlycon root=/dev/mmcblk0p14 console=ttyMSM0,115200 no_framebuffer=true rw androidboot.emmc=true androidboot.serialno=11c722 androidboot.baseband=msm mdss_mdp.panel=0:dsi:0:'

env:
  DEBIAN_FRONTEND: noninteractive
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 检出本套件
        uses: actions/checkout@v4

      - name: 安装交叉编译依赖
        run: |
          sudo apt-get -o Acquire::Retries=5 \
                       -o Acquire::http::Timeout=60 \
                       -o Acquire::https::Timeout=60 update
          sudo apt-get -o Acquire::Retries=5 \
                       -o Acquire::http::Timeout=60 \
                       -o Acquire::https::Timeout=60 \
                       install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libdw-dev libncurses-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            kmod cpio rsync xz-utils zstd device-tree-compiler \
            dwarves libelf-dev python3 git curl ca-certificates ccache

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-boot-msm8916-${{ inputs.kernel_ref || 'default' }}-${{ hashFiles('kernel-fragments/**') }}
          restore-keys: |
            ccache-boot-msm8916-${{ inputs.kernel_ref || 'default' }}-

      - name: 拉取内核源码
        run: |
          mkdir -p src && cd src
          if [ -n "${{ inputs.kernel_ref }}" ]; then
            git clone --depth 1 -b "${{ inputs.kernel_ref }}" \
              https://github.com/msm8916-mainline/linux.git linux
          else
            git clone --depth 1 https://github.com/msm8916-mainline/linux.git linux
          fi
          echo "=== 实际检出的分支/版本 ==="
          git -C linux branch --show-current
          echo "内核版本: $(git -C linux describe --tags 2>/dev/null || git -C linux rev-parse --short HEAD)"
          echo "=== 内核树里的 UFI/同类 DTB ==="
          ls linux/arch/arm64/boot/dts/qcom/ | grep -E "msm8916.*(thwc|uz801|ufi|mf800|jz)" || true

      - name: config 与 DTB
        run: |
          cd src/linux
          export PATH="/usr/lib/ccache:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          ccache -M 5G

          echo "----- 应用内核配置片段 kcfg是完整的内核配置 -----"
          ls -la ../../kernel-fragments/
          cp ../../kernel-fragments/kcfg .config
          make olddefconfig
          
          MAIN="${{ inputs.dtb_name }}"
          TGT="arch/arm64/boot/dts/qcom/$MAIN.dtb"
          echo "目标dtb: $(TGT)"
          
          if [ ! -f "$TGT" ]; then
            echo "!! 目标 DTB 不存在"
            exit 1
          fi
          
      - name: 编译内核与 DTB
        run: |
          cd src/linux
          export PATH="/usr/lib/ccache:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) Image.gz dtbs
          ls -lh arch/arm64/boot/Image.gz
          ls -lh arch/arm64/boot/dts/qcom/${{ inputs.dtb_name }}.dtb

      - name: 拼接 Image.gz-dtb
        run: |
          cd src/linux
          cat arch/arm64/boot/Image.gz \
              arch/arm64/boot/dts/qcom/${{ inputs.dtb_name }}.dtb \
              > arch/arm64/boot/Image.gz-dtb
          ls -lh arch/arm64/boot/Image.gz-dtb

      - name: 安装内核模块
        run: |
          cd src/linux
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make INSTALL_MOD_PATH="${{ github.workspace }}/modules_out" modules_install
          KERNEL_VERSION=$(make -s kernelrelease)
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> "$GITHUB_ENV"
          echo "模块已安装到 ${{ github.workspace }}/modules_out/lib/modules/$KERNEL_VERSION"
          du -sh "${{ github.workspace }}/modules_out"

      - name: 构建 Debian initramfs
        run: |
          # 安装 initramfs-tools
          sudo apt-get install -y initramfs-tools

          # 将交叉编译的模块放到 mkinitramfs 能找到的路径
          sudo mkdir -p "/lib/modules/$KERNEL_VERSION"
          sudo cp -a "${{ github.workspace }}/modules_out/lib/modules/$KERNEL_VERSION/." "/lib/modules/$KERNEL_VERSION/"
          sudo depmod -a "$KERNEL_VERSION"

          # 确保 initramfs 包含挂载 eMMC/ext4 根分区必需的模块
          # 如果你的内核把 sdhci/mmc/ext4 编译进了内核（=y），这些行不是必须的，但保留无害
          for m in sdhci_msm mmc_block ext4; do
            echo "$m" | sudo tee -a /etc/initramfs-tools/modules
          done

          # 使用 MODULES=most 生成“完整” initramfs，包含大部分可用模块，便于调试和恢复
          echo 'MODULES=most' | sudo tee /etc/initramfs-tools/initramfs.conf

          sudo mkinitramfs -k "$KERNEL_VERSION" -o "${{ github.workspace }}/initrd.img"
          ls -lh "${{ github.workspace }}/initrd.img"
          file "${{ github.workspace }}/initrd.img"

      - name: 安装 abootimg 并打包 boot.img
        run: |
          sudo apt-get install -y abootimg

          # MSM8916 标准地址布局（与你 cmdline 中的 root= 配合使用）
          # base = 0x80000000
          # kernel_offset = 0x00080000  -> kerneladdr = 0x80080000
          # ramdisk_offset = 0x02000000 -> ramdiskaddr = 0x82000000
          # second_offset = 0x00f00000  -> secondaddr  = 0x80f00000
          # tags_offset = 0x01e00000    -> tagsaddr    = 0x81e00000
          # pagesize = 2048 (0x800)

          abootimg --create boot.img \
            -k src/linux/arch/arm64/boot/Image.gz-dtb \
            -r initrd.img \
            -c "cmdline=${{ inputs.boot_cmdline }}" \
            -c "pagesize=0x800" \
            -c "kerneladdr=0x80080000" \
            -c "ramdiskaddr=0x82000000" \
            -c "secondaddr=0x80f00000" \
            -c "tagsaddr=0x81e00000"

          ls -lh boot.img
          # 快速检查 boot.img 头部信息
          abootimg -i boot.img || true

      - name: 上传 boot.img 工件
        uses: actions/upload-artifact@v4
        with:
          name: boot-msm8916-${{ inputs.dtb_name }}
          path: boot.img
     