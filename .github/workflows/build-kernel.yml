name: build-kernel
on:
  workflow_dispatch:
    inputs:
      dtb_name:
        description: '主 DTB（起不来就换，见下方选项）'
        required: true
        default: 'msm8916-yiming-uz801v3'
        type: choice
        options:
          - msm8916-thwc-ufi001c
          - msm8916-thwc-uf896
          - msm8916-yiming-uz801v3
          - msm8916-fy-mf800
      oc_hz:
        description: 'CPU 最高频率(Hz)。1209600000=1.2GHz(推荐) / 1401600000=1.4GHz(激进) / 0=不超频'
        required: true
        default: '0'
      oc_microvolt:
        description: 'opp-microvolt。留空=继承最高频点写法；当前内核 OPP 表无此属性，电压由 CPR 管，一般别填'
        required: false
        default: ''
      modem_mode:
        description: '4G基带：ondemand=ondemand装但不自启(省内存,推荐) / onboot=开机自启 / none=移除'
        required: true
        default: 'ondemand'
        type: choice
        options: [ondemand, onboot, none]
      kernel_ref:
        description: '内核分支/tag。留空=用仓库默认分支(最稳)；想指定可填 wip/msm8916/v6.18-rc4 之类'
        required: false
        default: ''
      rootfs_size_mb:
        description: 'rootfs 镜像大小(MB)，刷完在设备上 resize2fs 撑满'
        required: true
        default: '1400'
      firmware_url:
        description: '可选：modem/wcnss 固件包的直链(zip/tar)。留空则留待刷完后手动拷入'
        required: false
        default: ''
      publish_release:
        description: '是否发布到 GitHub Release（产物较大时用它，不受 500MB artifact 限制）'
        required: false
        default: false
        type: boolean

env:
  DEBIAN_FRONTEND: noninteractive
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # 留 10 分钟余量，硬上限是 360

    steps:
      # ------------------------------------------------------------------
      # 1. 腾磁盘：runner 只有约 14GB SSD，预装工具链就占掉一大半
      # ------------------------------------------------------------------
      - name: 清理预装大件
        run: |
          df -h / /mnt || true
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm 2>/dev/null || true
          sudo apt-get clean
          echo "=== 清理后 ==="
          df -h /

      - name: 检出本套件
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. 依赖
      # ------------------------------------------------------------------
      - name: 安装交叉编译与打包依赖
        run: |
          sudo apt-get -o Acquire::Retries=5 \
                       -o Acquire::http::Timeout=60 \
                       -o Acquire::https::Timeout=60 update
          sudo apt-get -o Acquire::Retries=5 \
                       -o Acquire::http::Timeout=60 \
                       -o Acquire::https::Timeout=60 \
                       install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            kmod cpio rsync xz-utils zstd device-tree-compiler u-boot-tools \
            debootstrap qemu-user-static binfmt-support \
            e2fsprogs dosfstools util-linux parted \
            dwarves libelf-dev libdw-dev \
            python3 git curl ca-certificates ccache dpkg-dev debhelper
          sudo apt-get install -y --no-install-recommends libssl-dev:arm64 || true  
          sudo update-binfmts --enable qemu-aarch64 || true
          echo "=== qemu binfmt ==="
          ls /proc/sys/fs/binfmt_misc/ | grep -i qemu || echo "(未见，debootstrap 第二阶段可能失败)"

      # ------------------------------------------------------------------
      # 3. ccache：改 DTB 重跑时能省下大半个内核编译时间
      #    actions/cache 每仓库 10GB 配额，内核 ccache 一般 1-3GB
      # ------------------------------------------------------------------
      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-msm8916-${{ inputs.kernel_ref || 'default' }}-${{ inputs.dtb_name }}-${{ inputs.oc_hz }}
          restore-keys: |
            ccache-msm8916-${{ inputs.kernel_ref || 'default' }}-

      # ------------------------------------------------------------------
      # 4. 源码
      # ------------------------------------------------------------------
      - name: 拉取内核与 bootchain 源码
        run: |
          mkdir -p src && cd src

          # 关键：不写死分支名。msm8916-mainline 各仓库的默认分支不一定是 master，
          # 写死 -b master 会直接 fatal: Remote branch master not found。
          # kernel_ref 留空 = 用仓库自己的默认分支（HEAD），最稳。
          if [ -n "${{ inputs.kernel_ref }}" ]; then
            git clone --depth 1 -b "${{ inputs.kernel_ref }}" \
              https://github.com/msm8916-mainline/linux.git linux
          else
            git clone --depth 1 https://github.com/msm8916-mainline/linux.git linux
          fi

          git clone --depth 1 https://github.com/msm8916-mainline/lk2nd.git
          git clone --depth 1 https://github.com/msm8916-mainline/qhypstub.git
          git clone --depth 1 https://github.com/msm8916-mainline/qtestsign.git

          echo "=== 实际检出的分支/版本 ==="
          git -C linux     branch --show-current
          git -C lk2nd     branch --show-current
          git -C qhypstub  branch --show-current
          git -C qtestsign branch --show-current
          echo "内核版本: $(git -C linux describe --tags 2>/dev/null || git -C linux rev-parse --short HEAD)"
          echo "可用的 UFI/通用 DTB："
          ls linux/arch/arm64/boot/dts/qcom/ | grep -E "msm8916.*(thwc|uz801|ufi|mf800|jz)" || true

      # ------------------------------------------------------------------
      # 5. bootchain：qhypstub -> hyp.mbn，lk2nd -> aboot.mbn
      # ------------------------------------------------------------------
      - name: 编译 bootchain
        run: |
          cd src
          make -C qhypstub CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)"
          ls -lh qhypstub/*.elf 2>/dev/null || true

          # lk2nd 的 make 目标名在不同版本间会变。探针确认 target/ 下有 msm8916，
          # 但顶层 Makefile 里 grep 不到目标定义，说明它走的是另一套规则。
          # 依次尝试，避免因为目标名对不上直接挂掉。
          cd lk2nd
          for TGT in lk1st-msm8916 msm8916 lk2nd-msm8916 ""; do
            echo "--- 尝试 lk2nd 目标: '${TGT:-<默认>}' ---"
            if [ -z "$TGT" ]; then
              make TOOLCHAIN_PREFIX=arm-none-eabi- -j"$(nproc)" && break
            else
              make TOOLCHAIN_PREFIX=arm-none-eabi- "$TGT" -j"$(nproc)" && break
            fi
          done
          cd ..

          # 产物文件名同样不固定，按 glob 找
          LKIMG=$(find lk2nd -name '*.img' -o -name '*.mbn' | grep -iE 'lk1st|lk2nd' | head -1)
          [ -z "$LKIMG" ] && LKIMG=$(find lk2nd -name '*.img' | head -1)
          [ -z "$LKIMG" ] && { echo "!! 未找到 lk2nd 产物"; find lk2nd -name '*.img' -o -name '*.bin' | head -20; exit 1; }
          echo "lk2nd 产物: $LKIMG"

          mkdir -p ../files
          python3 qtestsign/qtestsign.py hyp  qhypstub/qhypstub.elf -o ../files/hyp.mbn
          python3 qtestsign/qtestsign.py aboot "$LKIMG" -o ../files/aboot.mbn
          ls -lh ../files/hyp.mbn ../files/aboot.mbn

      # ------------------------------------------------------------------
      # 6. 超频补丁：先看现有 OPP，再克隆最高频点属性生成新节点
      #    （不硬编码电压——不同内核版本写法不同，写死会死机或伤芯片）
      # ------------------------------------------------------------------
      - name: 应用 CPU 超频补丁
        run: |
          DTSI=src/linux/arch/arm64/boot/dts/qcom/msm8916.dtsi

          python3 tools/opp-overclock.py --check --dtsi "$DTSI" \
            || echo "!! --check 未通过，跳过超频（不影响出包）"

          if [ "${{ inputs.oc_hz }}" != "0" ]; then
            ARGS=(--apply --hz "${{ inputs.oc_hz }}" --dtsi "$DTSI")
            [ -n "${{ inputs.oc_microvolt }}" ] && ARGS+=(--microvolt "${{ inputs.oc_microvolt }}")
            python3 tools/opp-overclock.py "${ARGS[@]}" \
              || echo "!! 超频补丁未应用，按内核默认频率出包"
          else
            echo "oc_hz=0，跳过超频"
          fi

          echo "=== 补丁后 OPP 复核 ==="
          python3 tools/opp-overclock.py --check --dtsi "$DTSI" || true
          echo "=== 生成的节点内容 ==="
          grep -A3 "opp-${{ inputs.oc_hz }}" "$DTSI" || echo "(未插入，按默认频率)"

      # ------------------------------------------------------------------
      # 7. 内核与 deb 升级包编译
      # ------------------------------------------------------------------
      - name: 编译内核、模块与 deb 包
        run: |
          cd src/linux
          export PATH="/usr/lib/ccache:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          ccache -M 5G

          for DC in msm8916_defconfig qcom_defconfig defconfig; do
            echo "--- 尝试 defconfig: $DC ---"
            if make "$DC" 2>&1 | tail -3; then
              test -f .config && break
            fi
          done
          test -f .config || { echo "!! 无法生成 .config"; exit 1; }

          chmod +x scripts/kconfig/merge_config.sh 2>/dev/null || true
          if [ -f ../../kernel-fragments/ufi-lowmem.config ]; then
            ./scripts/kconfig/merge_config.sh -m .config \
              ../../kernel-fragments/ufi-lowmem.config
          else
            echo "!! 找不到低内存配置片段，跳过合并"
          fi
          make olddefconfig

          if ! make -j"$(nproc)" CC="ccache ${CROSS_COMPILE}gcc" \
                     Image.gz dtbs modules > /tmp/kbuild.log 2>&1; then
            echo "===== 内核编译失败，最后 60 行 ====="
            tail -60 /tmp/kbuild.log
            exit 1
          fi
          tail -5 /tmp/kbuild.log

          # 【新增】使用内核自带的 bindeb-pkg 目标编译 deb 包
          # 注意：交叉编译 deb 需要把 ARCH 和 CROSS_COMPILE 传给 debian 目标
          echo "=== 开始构建内核 .deb 升级包 ==="
          dpkg -s libssl-dev >/dev/null 2>&1 || { echo "libssl-dev missing"; exit 1; }
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KBUILD_DEBARGS="-d" bindeb-pkg

          # modules_install 维持原样给制作 rootfs 使用
          make -j"$(nproc)" modules_install \
               INSTALL_MOD_PATH=../../build/modules \
               INSTALL_MOD_STRIP=1 DEPMOD=true
          KVER=$(make kernelrelease); echo "$KVER" > ../../files/kernel-version.txt
          echo "内核版本: $KVER"

      - name: 收内核产物与 deb 包
        run: |
          cd src/linux
          mkdir -p ../../files/dtbs/qcom
          cp arch/arm64/boot/Image.gz ../../files/

          for f in arch/arm64/boot/dts/qcom/msm8916-*.dtb; do
            [ -f "$f" ] && cp "$f" ../../files/dtbs/qcom/
          done

          MAIN="${{ inputs.dtb_name }}"
          if [ ! -f "../../files/dtbs/qcom/$MAIN.dtb" ]; then
            MAIN=$(ls ../../files/dtbs/qcom/ | sed 's/\.dtb$//' | head -1)
          fi
          echo "MAIN_DTB=$MAIN" >> $GITHUB_ENV

          dtc -I dtb -O dts "../../files/dtbs/qcom/$MAIN.dtb" \
            -o "../../files/dtbs/qcom/$MAIN.dts" 2>/dev/null || true

          tar -C ../../build/modules -czf ../../files/modules.tar.gz lib

          # 【新增】将上级目录生成的 linux-*.deb 移动到 files/ 目录以便打包
          # bindeb-pkg 生成的 deb 通常在源码树的上一级目录 (即 src/)
          echo "=== 收集生成的 .deb 包 ==="
          ls -lh ../*.deb || true
          cp ../*.deb ../../files/ 2>/dev/null || true

          cd ../.. && rm -rf src/linux src/lk2nd src/qhypstub src/qtestsign
          df -h /

      # ------------------------------------------------------------------
      # 8. rootfs：debootstrap trixie
      # ------------------------------------------------------------------
      - name: debootstrap Debian 13
        run: |
          sudo debootstrap --arch arm64 --foreign \
            --variant=minbase \
            --components=main,contrib,non-free-firmware \
            --include=ca-certificates,locales,tzdata \
            trixie rootfs http://deb.debian.org/debian
          sudo cp -a /usr/bin/qemu-aarch64-static rootfs/usr/bin/
          sudo chroot rootfs /debootstrap/debootstrap --second-stage

      - name: 安装软件包与内核模块
        run: |
          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb http://deb.debian.org/debian trixie main contrib non-free-firmware
          deb http://deb.debian.org/debian trixie-updates main contrib non-free-firmware
          deb http://security.debian.org/debian-security trixie-security main contrib non-free-firmware
          EOF
          case "${{ inputs.modem_mode }}" in
            onboot|ondemand) MPKGS=modemmanager ;;
            none)            MPKGS="" ;;
          esac
          sudo chroot rootfs bash -c "apt-get update && \
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            systemd systemd-sysv udev dbus openssh-server network-manager \
            wireless-tools wpasupplicant iw adbd zram-tools \
            procps psmisc htop vim-tiny nano curl wget ca-certificates \
            iproute2 iptables isc-dhcp-client tzdata locales sudo ${MPKGS}"

          sudo rm -rf /tmp/modstage && sudo mkdir -p /tmp/modstage
          sudo tar -C /tmp/modstage -xzf files/modules.tar.gz
          sudo mkdir -p rootfs/usr/lib/modules
          sudo cp -a /tmp/modstage/lib/modules/. rootfs/usr/lib/modules/
          sudo rm -rf /tmp/modstage

          if [ ! -e rootfs/lib/ld-linux-aarch64.so.1 ]; then
            if [ -d rootfs/lib ] && [ ! -L rootfs/lib ]; then
              sudo cp -a rootfs/lib/. rootfs/usr/lib/ 2>/dev/null || true
              sudo rm -rf rootfs/lib
            fi
            sudo ln -sfn usr/lib rootfs/lib
          fi

      - name: 部署 overlay（ADB gadget / 内存优化 / 网络）
        run: |
          sudo cp -a overlay/. rootfs/
          sudo chmod +x rootfs/usr/local/sbin/ufi-usb-gadget
          sudo chmod 600 rootfs/etc/NetworkManager/system-connections/*.nmconnection 2>/dev/null || true
          sudo mkdir -p rootfs/root/.android rootfs/dev/usb-ffs

          sudo grep -q '^shell:' rootfs/etc/group \
            || echo 'shell:x:2000:' | sudo tee -a rootfs/etc/group >/dev/null
          sudo grep -q '^shell:' rootfs/etc/passwd \
            || echo 'shell:x:2000:2000::/home/shell:/bin/bash' | sudo tee -a rootfs/etc/passwd >/dev/null
          sudo grep -q '^shell:' rootfs/etc/shadow \
            || echo 'shell:!*:19000:0:99999:7:::' | sudo tee -a rootfs/etc/shadow >/dev/null
          sudo mkdir -p rootfs/home/shell

      - name: 可选：装入 modem/wcnss 固件
        if: ${{ inputs.firmware_url != '' }}
        run: |
          cd /tmp && curl -fsSL "${{ inputs.firmware_url }}" -o fw.bin
          mkdir -p fw && (unzip -q -o fw.bin -d fw || tar xf fw.bin -C fw)
          sudo mkdir -p rootfs/lib/firmware
          sudo find fw -type f \
            \( -name 'modem.*' -o -name 'mba.*' -o -name 'wcnss.*' \
               -o -name 'playread.*' -o -name 'cmnlib.*' -o -name 'keymaste.*' \
               -o -name 'widevine.*' -o -name 'sec.*' \) \
            -exec cp {} rootfs/lib/firmware/ \;

      - name: 精简与清理
        run: |
          echo 'ufi103s' | sudo tee rootfs/etc/hostname >/dev/null
          printf '127.0.0.1\tlocalhost\n127.0.1.1\tufi103s\n' | sudo tee rootfs/etc/hosts >/dev/null

          PW='$6$sGEK/TnRIvw03Oex$LCH3DvNfyrjc9Zosz.nMLz9t4CHaCP1JKz8nx8SehCP2CTuYeojmy7FwEH3zgvZsnQMp.I0332aj.gHRziGY7/'
          sudo grep -q '^sudo:' rootfs/etc/group || echo 'sudo:x:27:' | sudo tee -a rootfs/etc/group >/dev/null
          sudo grep -q '^adm:'  rootfs/etc/group || echo 'adm:x:4:'  | sudo tee -a rootfs/etc/group >/dev/null
          sudo grep -q '^user:' rootfs/etc/group  || echo 'user:x:1000:' | sudo tee -a rootfs/etc/group >/dev/null
          sudo grep -q '^user:' rootfs/etc/passwd || echo 'user:x:1000:1000::/home/user:/bin/bash' | sudo tee -a rootfs/etc/passwd >/dev/null
          sudo grep -q '^user:' rootfs/etc/shadow || echo "user:$PW:19000:0:99999:7:::" | sudo tee -a rootfs/etc/shadow >/dev/null
          sudo sed -i 's/^\(sudo:x:27:\)/\1user/' rootfs/etc/group
          sudo sed -i 's/^\(adm:x:4:\)/\1user/' rootfs/etc/group
          sudo sed -i "s|^root:[^:]*:|root:$PW:|" rootfs/etc/shadow
          sudo mkdir -p rootfs/home/user && sudo chown 1000:1000 rootfs/home/user
          sudo mkdir -p rootfs/home/shell && sudo chown 2000:2000 rootfs/home/shell

          sudo sed -i 's/^# *en_US.UTF-8/en_US.UTF-8/' rootfs/etc/locale.gen 2>/dev/null || true
          sudo sed -i 's/^# *zh_CN.UTF-8/zh_CN.UTF-8/' rootfs/etc/locale.gen 2>/dev/null || true
          echo 'LANG=C.UTF-8' | sudo tee rootfs/etc/default/locale >/dev/null
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai rootfs/etc/localtime
          echo 'Asia/Shanghai' | sudo tee rootfs/etc/timezone >/dev/null

          WANTS=rootfs/etc/systemd/system/multi-user.target.wants
          sudo mkdir -p "$WANTS"
          enable_unit() {
            local inst="$1" unit="${2:-$1}"
            if   [ -f "rootfs/etc/systemd/system/$unit" ]; then
              sudo ln -sf "/etc/systemd/system/$unit" "$WANTS/$inst"
            elif [ -f "rootfs/usr/lib/systemd/system/$unit" ]; then
              sudo ln -sf "/usr/lib/systemd/system/$unit" "$WANTS/$inst"
            fi
          }
          for s in bluetooth.service avahi-daemon.service cups.service rsyslog.service \
                   cron.service systemd-timesyncd.service ModemManager.service; do
            sudo find rootfs/etc/systemd/system -path '*.wants/*' -name "$s" -delete 2>/dev/null || true
          done
          for t in apt-daily.timer apt-daily-upgrade.timer man-db.timer \
                   e2scrub_all.timer fstrim.timer; do
            sudo find rootfs/etc/systemd/system -path '*.wants/*' -name "$t" -delete 2>/dev/null || true
          done
          enable_unit serial-getty@ttyMSM0.service 'serial-getty@.service'
          enable_unit zramswap.service
          enable_unit ufi-usb-gadget.service
          enable_unit adbd.service
          if [ '${{ inputs.modem_mode }}' = 'onboot' ]; then enable_unit ModemManager.service; fi
          if [ '${{ inputs.modem_mode }}' = 'none' ]; then
            sudo ln -sf /dev/null rootfs/etc/systemd/system/ModemManager.service
          fi

          sudo mkdir -p rootfs/etc/systemd/journald.conf.d
          sudo tee rootfs/etc/systemd/journald.conf.d/99-lowmem.conf >/dev/null <<'JCF'
          [Journal]
          SystemMaxUse=16M
          RuntimeMaxUse=8M
          MaxRetentionSec=3day
          Storage=volatile
          Compress=yes
          ForwardToSyslog=no
          JCF
          printf 'ALGO=lz4\nPERCENT=60\nPRIORITY=100\n' | sudo tee rootfs/etc/default/zramswap >/dev/null

          sudo rm -f rootfs/usr/bin/qemu-aarch64-static
          sudo rm -rf rootfs/var/lib/apt/lists/*
          sudo rm -rf rootfs/var/cache/apt/archives/*.deb
          sudo rm -rf rootfs/usr/share/doc/* rootfs/usr/share/man/* rootfs/usr/share/info/* 2>/dev/null || true

      # ------------------------------------------------------------------
      # 9. 打包镜像
      # ------------------------------------------------------------------
      - name: 打包 boot.bin / rootfs.bin
        run: |
          MAIN="${MAIN_DTB:-${{ inputs.dtb_name }}}"
          CMDLINE="root=LABEL=DebianRoot rw console=ttyMSM0,115200 console=tty0 earlycon rootwait transparent_hugepage=never"

          sudo mkdir -p build/mnt build/bootstg/dtbs/qcom build/bootstg/extlinux
          sudo cp files/Image.gz build/bootstg/
          sudo cp files/dtbs/qcom/*.dtb build/bootstg/dtbs/qcom/

          PRIO="msm8916-thwc-ufi001c msm8916-thwc-uf896 msm8916-yiming-uz801v3 msm8916-xiaoxun-jz0145-v33"

          {
            echo "UI menu.c32"
            echo "PROMPT 5"
            echo "TIMEOUT 50"
            echo "DEFAULT debian13"
            echo ""
            echo "LABEL debian13"
            echo "    MENU LABEL Debian 13 (主: $MAIN)"
            echo "    KERNEL /Image.gz"
            echo "    FDT /dtbs/qcom/$MAIN.dtb"
            echo "    APPEND $CMDLINE loglevel=4 systemd.show_status=0"
            echo ""
            i=0
            for n in $PRIO; do
              [ "$n" = "$MAIN" ] && continue
              [ -f "build/bootstg/dtbs/qcom/$n.dtb" ] || continue
              i=$((i+1))
              echo "LABEL alt$i"
              echo "    MENU LABEL Debian 13 (随身WiFi 备选 $i: $n)"
              echo "    KERNEL /Image.gz"
              echo "    FDT /dtbs/qcom/$n.dtb"
              echo "    APPEND $CMDLINE loglevel=7"
              echo ""
            done
            for f in build/bootstg/dtbs/qcom/*.dtb; do
              n=$(basename "$f" .dtb)
              [ "$n" = "$MAIN" ] && continue
              case " $PRIO " in *" $n "*) continue;; esac
              i=$((i+1))
              [ "$i" -gt 12 ] && break
              echo "LABEL alt$i"
              echo "    MENU LABEL Debian 13 (其他: $n)"
              echo "    KERNEL /Image.gz"
              echo "    FDT /dtbs/qcom/$n.dtb"
              echo "    APPEND $CMDLINE loglevel=7"
              echo ""
            done
          } > /tmp/extlinux.conf
          sudo cp /tmp/extlinux.conf build/bootstg/extlinux/extlinux.conf

          dd if=/dev/zero of=files/boot.bin bs=1M count=64 status=none
          sudo mkfs.ext2 -F -L boot files/boot.bin >/dev/null
          if sudo mount -o loop files/boot.bin build/mnt; then
            sudo cp -a build/bootstg/. build/mnt/
            sync; sudo umount build/mnt
          fi

          dd if=/dev/zero of=files/rootfs.bin bs=1M count=${{ inputs.rootfs_size_mb }} status=none
          sudo mkfs.ext4 -F -L rootfs -O ^has_journal,^metadata_csum files/rootfs.bin >/dev/null
          if sudo mount -o loop files/rootfs.bin build/mnt; then
            sudo cp -a rootfs/. build/mnt/
            RU=$(sudo blkid -s UUID -o value files/rootfs.bin)
            BU=$(sudo blkid -s UUID -o value files/boot.bin)
            sudo mkdir -p build/mnt/etc
            sudo tee build/mnt/etc/fstab >/dev/null <<EOF
          UUID=$RU  /        ext4  defaults,noatime,nodiratime,errors=remount-ro  0 1
          UUID=$BU  /boot    ext2  defaults,noatime                               0 2
          tmpfs     /tmp     tmpfs defaults,nosuid,size=32M                       0 0
          tmpfs     /var/log tmpfs defaults,nosuid,size=16M                       0 0
          tmpfs     /run     tmpfs defaults,nosuid,size=16M                       0 0
          EOF
            sync; sudo umount build/mnt
          fi

      - name: 压缩（artifact 额度只有 500MB，必须压）
        run: |
          cd files
          xz -6 -T0 -f boot.bin rootfs.bin
          sha256sum *.xz *.mbn *.deb kernel-version.txt > SHA256SUMS
          echo "=== 压缩后产物 ==="
          ls -lh

      # ------------------------------------------------------------------
      # 10. 上传
      # ------------------------------------------------------------------
      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ufi103s-debian13-${{ inputs.dtb_name }}-${{ inputs.oc_hz }}
          path: |
            files/boot.bin.xz
            files/rootfs.bin.xz
            files/hyp.mbn
            files/aboot.mbn
            files/linux-*.deb
            files/SHA256SUMS
            files/kernel-version.txt
          retention-days: 30

      - name: 发布到 Release（可选）
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ufi103s-${{ github.run_number }}
          name: UFI103S Debian13 ${{ inputs.dtb_name }} @ ${{ inputs.oc_hz }}Hz
          files: |
            files/boot.bin.xz
            files/rootfs.bin.xz
            files/hyp.mbn
            files/aboot.mbn
            files/linux-*.deb
            files/SHA256SUMS