name: build-kernel-deb
on:
  workflow_dispatch:
    inputs:
      oc_hz:
        description: 'CPU 最高频率(Hz)。1209600000=1.2GHz / 1401600000=1.4GHz / 0=不超频'
        required: true
        default: '0'
      oc_microvolt:
        description: 'opp-microvolt。留空=继承最高频点写法；当前内核 OPP 表无此属性，一般别填'
        required: false
        default: ''
      kernel_ref:
        description: '内核分支/tag。留空=用仓库默认分支(最稳)'
        required: false
        default: ''
      publish_release:
        description: '是否发布到 GitHub Release（deb 很大时用它，不受 500MB artifact 限制）'
        required: false
        default: false
        type: boolean

env:
  DEBIAN_FRONTEND: noninteractive
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # 留 10 分钟余量，硬上限是 360

    steps:
      - name: 检出本套件
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 依赖：交叉编译 + deb 打包工具链即可，不再需要 debootstrap/qemu
      # ------------------------------------------------------------------
      - name: 安装交叉编译与 deb 打包依赖
        run: |
          sudo apt-get -o Acquire::Retries=5 \
                       -o Acquire::http::Timeout=60 \
                       -o Acquire::https::Timeout=60 update
          sudo apt-get -o Acquire::Retries=5 \
                       -o Acquire::http::Timeout=60 \
                       -o Acquire::https::Timeout=60 \
                       install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libdw-dev libncurses-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            kmod cpio rsync xz-utils zstd device-tree-compiler \
            dwarves libelf-dev dpkg-dev debhelper devscripts fakeroot \
            python3 git curl ca-certificates ccache

      # ------------------------------------------------------------------
      # ccache：改频率/改 DTB 重跑时能省下大半个内核编译时间
      # ------------------------------------------------------------------
      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-msm8916-${{ inputs.kernel_ref || 'default' }}-${{ inputs.oc_hz }}
          restore-keys: |
            ccache-msm8916-${{ inputs.kernel_ref || 'default' }}-

      # ------------------------------------------------------------------
      # 拉内核源码（不写死分支名，避免 master 不存在直接挂）
      # ------------------------------------------------------------------
      - name: 拉取内核源码
        run: |
          mkdir -p src && cd src
          if [ -n "${{ inputs.kernel_ref }}" ]; then
            git clone --depth 1 -b "${{ inputs.kernel_ref }}" \
              https://github.com/msm8916-mainline/linux.git linux
          else
            git clone --depth 1 https://github.com/msm8916-mainline/linux.git linux
          fi
          echo "=== 实际检出的分支/版本 ==="
          git -C linux branch --show-current
          echo "内核版本: $(git -C linux describe --tags 2>/dev/null || git -C linux rev-parse --short HEAD)"

      - name: 编译内核 deb 升级包
        run: |
          cd src/linux
          export PATH="/usr/lib/ccache:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          ccache -M 5G

          # --- 关键：绕过 dpkg-checkbuilddeps 对 arm64 libssl-dev 的检查 ---
          mkdir -p /tmp/dpkgshim
          cat > /tmp/dpkgshim/dpkg-buildpackage <<'EOF'
          #!/bin/bash
          exec /usr/bin/dpkg-buildpackage -d "$@"
          EOF
          chmod +x /tmp/dpkgshim/dpkg-buildpackage
          export PATH="/tmp/dpkgshim:$PATH"
          which dpkg-buildpackage

          #for DC in msm8916_defconfig qcom_defconfig defconfig; do
          #  echo "--- 尝试 defconfig: $DC ---"
          #  if make "$DC" 2>&1 | tail -3; then
          #    test -f .config && break
          #  fi
          #done
          
          echo "-----"
          ls -la ../../kernel-fragments/
          cp ../../kernel-fragments/kcfg .config
          cat .config | grep -E 'FIG_DEBUG_IN'
          echo "-----"
          mkdir -p ../../files
          pwd
          ls -a ./
          cp .config ../../files/cfg
          echo "-----"
          
          test -f .config || { echo "!! 无法生成 .config"; exit 1; }

          #chmod +x scripts/kconfig/merge_config.sh 2>/dev/null || true
          #if [ -f ../../kernel-fragments/ufi-lowmem.config ]; then
          #  ./scripts/kconfig/merge_config.sh -m .config \
          #    ../../kernel-fragments/ufi-lowmem.config
          #else
          #  echo "!! 找不到低内存配置片段，跳过合并"
          #fi
          make olddefconfig

          echo "=== 开始构建内核 .deb 升级包 ==="
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- bindeb-pkg

          KVER=$(make kernelrelease)
          mkdir -p ../../files
          
          echo "$KVER" > ../../files/kernel-version.txt
          echo "内核版本: $KVER"

      # ------------------------------------------------------------------
      # bindeb-pkg 把 deb 写在源码树上一级（即 src/），按 glob 收走
      # ------------------------------------------------------------------
      - name: 收集内核产物与 deb 包
        run: |
          mkdir -p files
          echo "=== 收集生成的 .deb 包 ==="
          ls -lh src/ || true
          cp src/*.deb files/ 2>/dev/null || true
          

          # 顺手留一份 Image.gz 和主 DTB，方便手动刷机/排查
          cp src/linux/arch/arm64/boot/Image.gz files/ 2>/dev/null || true

          echo "=== files/ 内容 ==="
          ls -lh files/

      - name: 生成 SHA256SUMS
        run: |
          cd files
          sha256sum *.deb kernel-version.txt > SHA256SUMS
          echo "=== 最终产物 ==="
          ls -lh

      # ------------------------------------------------------------------
      # 上传
      # ------------------------------------------------------------------
      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            files/cfg
            files/*.deb
            files/Image.gz
            files/SHA256SUMS
            files/kernel-version.txt
          retention-days: 30
